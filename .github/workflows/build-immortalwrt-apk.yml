name: Build ImmortalWrt APK

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Repository to build"
        required: true
        default: "sbwml/luci-app-quickfile"
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
      sdk_url:
        description: "ImmortalWrt SDK tarball URL"
        required: true
        default: "https://downloads.immortalwrt.org/releases/25.12.1/targets/rockchip/armv8/immortalwrt-sdk-25.12.1-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-immortalwrt-apk.yml"
      - "quickfile/**"
      - "luci-app-quickfile/**"
  schedule:
    - cron: "37 18 * * 0"

permissions:
  contents: read

concurrency:
  group: quickfile-immortalwrt-25-12-1-${{ github.ref }}
  cancel-in-progress: false

env:
  IMMORTALWRT_RELEASE: "25.12.1"
  IMMORTALWRT_TARGET: "rockchip/armv8"
  IMMORTALWRT_ARCH: "aarch64_generic"

jobs:
  build:
    name: quickfile for ImmortalWrt 25.12.1 rockchip-armv8
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_REPOSITORY: ${{ github.event_name == 'push' && github.repository || github.event.inputs.source_repository || 'sbwml/luci-app-quickfile' }}
      SOURCE_REF: ${{ github.event_name == 'push' && github.sha || github.event.inputs.source_ref || 'main' }}
      SDK_URL: ${{ github.event.inputs.sdk_url || 'https://downloads.immortalwrt.org/releases/25.12.1/targets/rockchip/armv8/immortalwrt-sdk-25.12.1-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst' }}

    steps:
      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
          key: immortalwrt-sdk-dl-${{ env.IMMORTALWRT_RELEASE }}-${{ env.IMMORTALWRT_ARCH }}-${{ hashFiles('source/**/Makefile') }}
          restore-keys: |
            immortalwrt-sdk-dl-${{ env.IMMORTALWRT_RELEASE }}-${{ env.IMMORTALWRT_ARCH }}-

      - name: Download ImmortalWrt SDK
        run: |
          wget -O sdk.tar.zst "$SDK_URL"
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst --strip-components=1 -C sdk

      - name: Prepare package in SDK
        run: |
          mkdir -p sdk/package/quickfile
          rsync -a --delete --exclude='.git/' --exclude='.github/' source/ sdk/package/quickfile/

          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_quickfile=m
          CONFIG_PACKAGE_luci-app-quickfile=m
          EOF

          make defconfig

      - name: Build APK packages
        run: |
          cd sdk
          make package/quickfile/quickfile/compile V=s -j"$(nproc)"
          make package/quickfile/luci-app-quickfile/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          find sdk/bin/packages/"$IMMORTALWRT_ARCH" -type f \
            \( -name 'quickfile_*.apk' -o -name 'luci-app-quickfile_*.apk' \) \
            -exec cp -v {} artifacts/ \;

          test -n "$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"

          sha256sum artifacts/*.apk > artifacts/SHA256SUMS

          {
            echo "ImmortalWrt release: $IMMORTALWRT_RELEASE"
            echo "ImmortalWrt target: $IMMORTALWRT_TARGET"
            echo "ImmortalWrt architecture: $IMMORTALWRT_ARCH"
            echo "Source repository: $SOURCE_REPOSITORY"
            echo "Source ref: $SOURCE_REF"
            echo "Source commit: $(git -C source rev-parse HEAD)"
            echo "SDK URL: $SDK_URL"
          } > artifacts/build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickfile-immortalwrt-${{ env.IMMORTALWRT_RELEASE }}-rockchip-armv8-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
